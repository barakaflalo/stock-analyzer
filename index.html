<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAI — Smart Stock Analysis</title>
<meta name="description" content="AI-powered stock analysis for US & Israel markets">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StockAI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+Hebrew:wght@300;400;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stockai.css">
</head>
<body class="ltr" id="appBody">
<a href="#mainContent" class="skip-link" id="skipLink">Skip to content</a>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">StockAI</div>
  <div class="splash-tag">Smart Stock Analysis</div>
  <div class="splash-bar"><div class="splash-fill"></div></div>
  <div class="splash-dots"><div class="splash-dot"></div><div class="splash-dot"></div><div class="splash-dot"></div></div>
</div>

<script src="app-i18n.js"></script>

<!-- TICKER -->
<div class="ticker-wrap"><div class="ticker-track" id="tickerTrack">
<span class="ticker-item" style="color:var(--text-muted)">◈ StockAI — Loading live market data...</span>
</div></div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-tag">◈ AppNest &mdash; StockAI Pro</div>
      <div class="brand-name">StockAI</div>
      <div class="brand-sub" data-t="subtitle"></div>
    </div>
    <div class="header-right">
      <div class="header-top-row">
        <div class="lang-selector">
          <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="lang-he" onclick="setLang('he')">עב</button>
          <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">RU</button>
          <button class="lang-btn" id="lang-es" onclick="setLang('es')">ES</button>
          <button class="lang-btn" id="lang-ar" onclick="setLang('ar')">عر</button>
        </div>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="openGuide()" aria-label="Guide">?</button>
        <button class="icon-btn" id="btnAbout" onclick="openAbout()" aria-label="About">ℹ️</button>
      </div>
      <div class="header-bottom-row">
        <div class="ai-status" onclick="openSetup()" id="aiStatusBtn">
          <div class="ai-dot" id="aiDot"></div>
          <span class="ai-name" id="aiStatusName"></span>
          <span style="font-size:9px;opacity:.5;">⚙</span>
        </div>
        <button class="btn-watchlist" id="btnMarket" onclick="openMarket()">🔥</button>
        <button class="btn-watchlist" id="btnScore" onclick="openScoreboard()">📊</button>
        <button class="btn-watchlist" onclick="openWatchPanel()">
          <span data-t="watchlistBtn"></span>
          <span class="watchlist-count" id="watchCount">0</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="mainContent" tabindex="-1">
  <div class="pwa-banner" id="pwaBanner">
    <div class="pwa-banner-text"><strong id="pwaBannerTitle"></strong><br><span id="pwaBannerText"></span></div>
    <div style="display:flex;gap:7px;">
      <button class="btn-pwa-install" onclick="installPWA()" data-t="pwaInstall"></button>
      <button class="btn-pwa-dismiss" onclick="dismissPWA()" data-t="pwaDismiss"></button>
    </div>
  </div>

  <div class="search-card">
    <span class="search-label" data-t="searchLabel"></span>
    <div class="search-row">
      <input type="text" class="search-input" id="stockInput" data-tp="placeholder" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="acList" oninput="acInput()" onkeydown="acKey(event)">
      <div class="ac-list" id="acList" role="listbox"></div>
      <button class="btn-analyze" id="btnAnalyze" onclick="analyzeStock()" data-t="btnAnalyze"></button>
    </div>
    <div class="quick-picks">
      <button class="pick-btn" onclick="quickAnalyze('AAPL')">AAPL</button>
      <button class="pick-btn" onclick="quickAnalyze('TSLA')">TSLA</button>
      <button class="pick-btn" onclick="quickAnalyze('NVDA')">NVDA</button>
      <button class="pick-btn" onclick="quickAnalyze('MSFT')">MSFT</button>
      <button class="pick-btn" onclick="quickAnalyze('GOOGL')">GOOGL</button>
      <button class="pick-btn" onclick="quickAnalyze('TEVA')">TEVA</button>
      <button class="pick-btn" onclick="quickAnalyze('CHKP')">CHKP</button>
      <button class="pick-btn" onclick="quickAnalyze('MNDY')">MNDY</button>
      <button class="pick-btn" onclick="quickAnalyze('WIX')">WIX</button>
      <button class="pick-btn" onclick="quickAnalyze('NICE')">NICE</button>
      <button class="pick-btn" onclick="quickAnalyze('PLX')">PLX</button>
      <button class="pick-btn" onclick="quickAnalyze('ICCM')">ICCM</button>
      <button class="pick-btn" onclick="quickAnalyze('PPBT')">PPBT</button>
    </div>
  </div>

  <!-- ══ DATA DISCLAIMER ══ -->
  <div class="data-disclaimer" id="dataDisclaimer"></div>

  <!-- ══ LIVE DATA CARD — נתונים חיים בחינם ══ -->
  <div class="live-card" id="liveCard">
    <div class="live-header">
      <div class="live-price-block">
        <div class="live-sym-row">
          <span class="live-sym" id="lvSym"></span>
          <span class="live-exchange" id="lvExchange"></span>
          <span class="live-badge" id="lvLive" aria-live="polite"></span>
        </div>
        <div class="live-name" id="lvName"></div>
        <div class="live-price" id="lvPrice"></div>
        <div class="live-change" id="lvChange"></div>
        <div class="live-market-state" id="lvMarketState"></div>
      </div>
      <div class="live-updated" id="lvUpdated"></div>
    </div>
    <div class="live-tabs" id="liveTabs"></div>
    <div class="chart-wrap" id="lvChartWrap">
      <div class="chart-ranges" id="chartRanges"></div>
      <div class="chart-canvas-wrap">
        <canvas id="liveChart"></canvas>
        <div class="chart-loading" id="chartLoading" style="display:none"></div>
      </div>
    </div>
    <div class="live-metrics" id="lvMetrics"></div>
    <div class="live-analyst" id="lvAnalyst" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvRecTrend" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvEarnHist" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvFinHist" style="display:none"></div>
    <div class="last-action" id="lvLastAction" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvInsiders" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvTech" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvTv" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvQuality" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvEvents" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvValue" style="display:none"></div>
    <div class="rec-trend-wrap" id="lvThesis" style="display:none"></div>
    <div class="live-company" id="lvCompany" style="display:none"></div>
    <div class="live-news" id="lvNews" style="display:none"></div>
    <div class="live-ai-cta" id="lvAiCta">
      <div class="live-ai-cta-text" id="lvAiCtaText"></div>
      <button class="btn-ai-analyze" id="btnAiFromLive" onclick="analyzeStock(currentLiveSymbol)"></button>
    </div>
  </div>

  <!-- ══ FX + CRYPTO ══ -->
  <div class="fx-section" id="fxSection">
    <div class="fx-tabs">
      <button class="fx-tab active" id="fxtab-forex" onclick="switchFxTab('forex')"></button>
      <button class="fx-tab" id="fxtab-crypto" onclick="switchFxTab('crypto')"></button>
    </div>
    <div id="fxContent"><div class="fx-loading">◈ ...</div></div>
  </div>

  <div class="loading-box" id="loadingBox">
    <div class="spinner"></div>
    <div class="loading-sym" id="loadingSym"></div>
    <div class="loading-steps">
      <div class="loading-step" data-t="loadStep1"></div>
      <div class="loading-step" data-t="loadStep2"></div>
      <div class="loading-step" data-t="loadStep3"></div>
      <div class="loading-step" data-t="loadStep4"></div>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="stock-id">
        <div class="stock-sym" id="rSym"></div>
        <div class="stock-fullname" id="rName"></div>
      </div>
      <div class="result-header-right">
        <div class="rec-badge" id="rRec"></div>
        <button class="btn-add-watch" id="btnAddWatch" onclick="toggleWatchFromResult()"></button>
      </div>
    </div>
    <div class="stale-bar" id="staleBar">
      <span class="stale-text" id="staleText"></span>
      <button class="btn-refresh" onclick="refreshAnalysis()" data-t="staleRefresh"></button>
    </div>
    <div class="metrics-grid">
      <div class="metric-cell"><div class="metric-label" data-t="metricPrice"></div><div class="metric-val" id="rPrice"></div></div>
      <div class="metric-cell"><div class="metric-label" data-t="metricTarget"></div><div class="metric-val" id="rTarget" style="color:var(--green)"></div></div>
      <div class="metric-cell"><div class="metric-label" data-t="metricAnalyst"></div><div class="metric-val" id="rAnalyst" style="color:var(--gold)"></div></div>
      <div class="metric-cell"><div class="metric-label" data-t="metricRisk"></div><div class="metric-val" id="rRisk"></div></div>
    </div>
    <div class="conf-section">
      <div class="conf-row"><span class="conf-label" data-t="confLabel"></span><span class="conf-num" id="rConfNum"></span></div>
      <div class="conf-track"><div class="conf-fill" id="rConfFill"></div></div>
    </div>
    <div class="body-sec"><div class="sec-label" data-t="secSummary"></div><div class="summary-txt" id="rSummary"></div></div>
    <div class="factors-wrap">
      <div class="factor-panel"><div class="sec-label" data-t="secBull"></div><div id="rBull"></div></div>
      <div class="factor-panel"><div class="sec-label" data-t="secBear"></div><div id="rBear"></div></div>
    </div>
    <div class="body-sec" id="rBottomLineSec" style="display:none;background:rgba(201,168,76,.05);">
      <div class="sec-label" id="rBottomLineLbl"></div>
      <div class="summary-txt" id="rBottomLine" style="font-weight:600;"></div>
    </div>
    <div class="body-sec" id="rMastersSec" style="display:none;">
      <div class="sec-label" id="rMastersLbl"></div>
      <div id="rMasters"></div>
    </div>
    <div class="body-sec" id="rProfilesSec" style="display:none;">
      <div class="sec-label" id="rProfilesLbl"></div>
      <div class="profile-cards" id="rProfiles"></div>
    </div>
    <div class="signals-row">
      <div class="signal-cell"><div class="signal-lbl" data-t="sigSocial"></div><div class="signal-val" id="rSocial"></div></div>
      <div class="signal-cell"><div class="signal-lbl" data-t="sigTech"></div><div class="signal-val" id="rTech"></div></div>
      <div class="signal-cell"><div class="signal-lbl" data-t="sigFund"></div><div class="signal-val" id="rFund" style="color:var(--gold)"></div></div>
    </div>
    <div class="body-sec" style="border-bottom:none">
      <div class="sec-label" data-t="secSources"></div>
      <div class="sources-row" id="rSources"></div>
    </div>
  </div>

  <div class="history-wrap" id="historyWrap" style="display:none">
    <div class="history-title" data-t="historyLabel"></div>
    <div class="history-items" id="historyItems"></div>
  </div>

  <div class="share-section">
    <div><div class="share-label-txt">AppNest</div><div style="font-size:12px;color:var(--text-dim);margin-top:3px;" data-t="moreApps"></div></div>
    <div class="share-btns">
      <button class="btn-share" onclick="shareApp()" data-t="shareBtn"></button>
      <a class="btn-more-apps" href="https://barakaflalo.github.io/appnest" target="_blank" data-t="moreApps"></a>
    </div>
  </div>
  <div class="disclaimer" id="disclaimer"></div>
  <button class="foot-ver" id="footVer" onclick="openAbout()">StockAI</button>
</main>

<div class="toast" id="toast"></div>

<!-- ══ WATCHLIST PANEL ══ -->
<div class="watch-overlay" id="watchOverlay" onclick="closeWatchPanel()"></div>
<div class="watch-panel" id="watchPanel">
  <div class="watch-panel-header">
    <div class="watch-panel-title" id="watchPanelTitle"></div>
    <button class="watch-close" onclick="closeWatchPanel()">✕</button>
  </div>
  <div class="watch-tabs">
    <button class="watch-tab active" id="tab-mine" onclick="switchTab('mine')" data-t="tabMine"></button>
    <button class="watch-tab" id="tab-israel" onclick="switchTab('israel')" data-t="tabIsrael"></button>
    <button class="watch-tab" id="tab-us" onclick="switchTab('us')" data-t="tabUS"></button>
  </div>
  <div class="watch-body">
    <div class="tab-pane active" id="pane-mine">
      <div class="watch-add-row">
        <input type="text" class="watch-add-input" id="watchAddInput" data-tp="addPlaceholder"
          onkeydown="if(event.key==='Enter')addToWatchlist()" oninput="this.value=this.value.toUpperCase()">
        <button class="watch-add-btn" onclick="addToWatchlist()" data-t="addBtn"></button>
      </div>
      <button class="btn-analyze-all" id="btnAnalyzeAll" onclick="analyzeAllWatchlist()" data-t="analyzeAll"></button>
      <div id="allResultsWrap" class="all-results-wrap" style="display:none"></div>
      <div class="watch-items-list" id="watchItemsList"></div>
      <div class="watch-backup-row">
        <button class="btn-backup" onclick="exportWatchlist()" data-t="backupExport"></button>
        <button class="btn-backup" onclick="importWatchlist()" data-t="backupImport"></button>
        <input type="file" id="importFileInput" accept=".json,.txt" style="display:none" onchange="handleImport(event)">
      </div>
    </div>
    <div class="tab-pane" id="pane-israel"><div class="preset-grid" id="israelList"></div></div>
    <div class="tab-pane" id="pane-us"><div class="preset-grid" id="usList"></div></div>
  </div>
</div>

<!-- ══ AI SETUP MODAL ══ -->
<div class="modal-overlay" id="setupOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" data-t="aiSetupTitle"></div>
      <button class="modal-close" onclick="closeSetup()">✕</button>
    </div>
    <div class="modal-body" id="setupModalBody">
      <!-- Rendered dynamically by renderSetup() -->
    </div>
  </div>
</div>

<!-- ══ ONBOARDING TOUR ══ -->
<div class="modal-overlay" id="tourOverlay">
  <div class="modal-box" style="max-width:460px">
    <div class="modal-body" id="tourBody"></div>
  </div>
</div>
<!-- ══ MARKET MODAL ══ -->
<div class="modal-overlay" id="marketOverlay">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title" id="marketTitle"></div><button class="modal-close" onclick="closeModal('marketOverlay')">✕</button></div>
    <div class="modal-body" id="marketBody"></div>
  </div>
</div>
<!-- ══ SCOREBOARD MODAL ══ -->
<div class="modal-overlay" id="scoreOverlay">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title" id="scoreTitle"></div><button class="modal-close" onclick="closeModal('scoreOverlay')">✕</button></div>
    <div class="modal-body" id="scoreBody"></div>
  </div>
</div>
<!-- ══ ABOUT MODAL ══ -->
<div class="modal-overlay" id="aboutOverlay">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title" id="aboutTitle"></div><button class="modal-close" onclick="closeModal('aboutOverlay')">✕</button></div>
    <div class="modal-body" id="aboutBody"></div>
  </div>
</div>

<!-- ══ GUIDE MODAL ══ -->
<div class="modal-overlay" id="guideOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" data-t="guideTitle"></div>
      <button class="modal-close" onclick="closeGuide()">✕</button>
    </div>
    <div class="guide-tabs" id="guideTabs"></div>
    <div id="guidePanes"></div>
  </div>
</div>
<script src="app-core.js"></script>
<script src="app-ai.js"></script>
<script src="app-ui.js"></script>
<script src="app-market.js"></script>
<script src="app-engines.js"></script>
<script src="app-value.js"></script>
<script src="app-platform.js"></script>
<script src="app-live.js"></script>
<script src="app-init.js"></script>
<!-- AppNest Assistant — המנוע זהה בכל האפליקציות; המפה: buildAssistantConfig() -->
<script src="appnest-assistant.js" defer onerror="this.remove()"></script>
</body>
</html>
