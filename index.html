function renderResult(r,symbol){
  if(!r)return;
  document.getElementById('rSym').textContent=r.symbol||symbol||'';
  document.getElementById('rName').textContent=r.companyName||'';
  document.getElementById('rPrice').textContent=r.currentPrice||'—';
  document.getElementById('rTarget').textContent=r.priceTarget||'—';
  document.getElementById('rAnalyst').textContent=r.analystRating||'—';
  document.getElementById('rSummary').textContent=r.summary||'';
  var conf=parseInt(r.confidenceScore)||0;
  document.getElementById('rConfNum').textContent=conf+'% — '+getConfLabel(conf);
  document.getElementById('rFund').textContent=(parseInt(r.fundamentalScore)||0)+'/100';
  setTimeout(function(){document.getElementById('rConfFill').style.width=conf+'%';},120);
  // Recommendation badge
  var recKey=(r.recommendation||'HOLD').toUpperCase();
  var recText=recKey==='BUY'?T('recBuy'):recKey==='SELL'?T('recSell'):T('recHold');
  var recPfx=recKey==='BUY'?'▲ ':recKey==='SELL'?'▼ ':'◼ ';
  var recEl=document.getElementById('rRec');recEl.textContent=recPfx+recText;
  recEl.className='rec-badge '+(recKey==='BUY'?'rec-buy':recKey==='SELL'?'rec-sell':'rec-hold');
  // Risk
  var riskMap={LOW:{t:T('riskLow'),c:'var(--green)'},MEDIUM:{t:T('riskMed'),c:'var(--yellow)'},HIGH:{t:T('riskHigh'),c:'var(--red)'}};
  var rd=riskMap[(r.riskLevel||'').toUpperCase()]||{t:r.riskLevel||'—',c:'var(--text)'};
  var rEl=document.getElementById('rRisk');rEl.textContent=rd.t;rEl.style.color=rd.c;
  // Social sentiment
  var socMap={POSITIVE:{t:T('sentPos'),c:'var(--green)'},NEUTRAL:{t:T('sentNeu'),c:'var(--yellow)'},NEGATIVE:{t:T('sentNeg'),c:'var(--red)'}};
  var sd=socMap[(r.socialSentiment||'').toUpperCase()]||{t:r.socialSentiment||'—',c:'var(--text)'};
  var sEl=document.getElementById('rSocial');sEl.textContent=sd.t;sEl.style.color=sd.c;
  // Technical signal
  var techMap={UP:{t:T('techUp'),c:'var(--green)'},DOWN:{t:T('techDown'),c:'var(--red)'},NEUTRAL:{t:T('techNeu'),c:'var(--yellow)'}};
  var td=techMap[(r.technicalSignal||'').toUpperCase()]||{t:r.technicalSignal||'—',c:'var(--text)'};
  var tEl=document.getElementById('rTech');tEl.textContent=td.t;tEl.style.color=td.c;
  // Bull/Bear factors
  var bullEl=document.getElementById('rBull');bullEl.innerHTML='';
  (r.bullishFactors||[]).forEach(function(f){var d=document.createElement('div');d.className='factor-item';d.innerHTML='<div class="factor-dot" style="background:var(--green)"></div><span>'+escHtml(f)+'</span>';bullEl.appendChild(d);});
  var bearEl=document.getElementById('rBear');bearEl.innerHTML='';
  (r.bearishFactors||[]).forEach(function(f){var d=document.createElement('div');d.className='factor-item';d.innerHTML='<div class="factor-dot" style="background:var(--red)"></div><span>'+escHtml(f)+'</span>';bearEl.appendChild(d);});
  // ── שורה תחתונה + פרופילי משקיע ──
  var blSec=document.getElementById('rBottomLineSec');
  if(r.bottomLine){
    document.getElementById('rBottomLineLbl').textContent=LT('bottomLineT');
    document.getElementById('rBottomLine').textContent=r.bottomLine;
    blSec.style.display='block';
  }else blSec.style.display='none';
  var prSec=document.getElementById('rProfilesSec');
  if(r.profiles&&(r.profiles.aggressive||r.profiles.moderate||r.profiles.conservative)){
    document.getElementById('rProfilesLbl').textContent=LT('profilesT');
    var ACT_COLORS={BUY:'var(--green)',HOLD:'var(--gold)',SELL:'var(--red)',AVOID:'var(--red)'};
    var ACT_LBL={BUY:LT('actBuy'),HOLD:LT('actHold'),SELL:LT('actSell'),AVOID:LT('actAvoid')};
    var ph='';
    [['aggressive','profAgg'],['moderate','profMod'],['conservative','profCon']].forEach(function(p){
      var d=r.profiles[p[0]];if(!d)return;
      var act=(d.action||'').toUpperCase();
      ph+='<div class="profile-card"><div class="profile-name">'+LT(p[1])+'</div>'
        +'<div class="profile-action" style="color:'+(ACT_COLORS[act]||'var(--text)')+'">'+(ACT_LBL[act]||act)+'</div>'
        +'<div class="profile-note">'+escHtml(d.note||'')+'</div></div>';
    });
    document.getElementById('rProfiles').innerHTML=ph;
    prSec.style.display='block';
  }else prSec.style.display='none';
  renderMasters(r);
  // Sources
  var srcEl=document.getElementById('rSources');srcEl.innerHTML='';
  (r.sources||[]).forEach(function(s){var sp=document.createElement('span');sp.className='source-tag';sp.textContent=s;srcEl.appendChild(sp);});
  document.getElementById('resultCard').classList.add('visible');
  try{document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
  currentSymbol=r.symbol||symbol;
  updateAddWatchBtn();
  // Check if stale
  var cache=getAnalysisCache();var entry=cache[currentSymbol];
  if(entry&&isStale(currentSymbol))showStaleBar(currentSymbol,entry.ts);
  else hideStaleBar();
}

function getConfLabel(s){if(s>=75)return T('confHigh');if(s>=50)return T('confMed');return T('confLow');}

function addToHistory(sym,result){
  analysisHistory.unshift({symbol:sym,result:result,time:new Date().toLocaleTimeString()});
  if(analysisHistory.length>5)analysisHistory.pop();
  persistHistory();
  renderHistory();
}
function renderHistory(){
  var wrap=document.getElementById('historyWrap');var list=document.getElementById('historyItems');
  if(!analysisHistory.length){wrap.style.display='none';return;}
  wrap.style.display='block';list.innerHTML='';
  analysisHistory.forEach(function(h){
    var recKey=(h.result.recommendation||'HOLD').toUpperCase();
    var color=recKey==='BUY'?'var(--green)':recKey==='SELL'?'var(--red)':'var(--gold)';
    var recText=recKey==='BUY'?T('recBuy'):recKey==='SELL'?T('recSell'):T('recHold');
    var el=document.createElement('div');el.className='hist-item';
    el.innerHTML='<div class="hist-sym" style="color:'+color+'">'+escHtml(h.symbol)+'</div>'
      +'<div class="hist-rec" style="color:'+color+'">'+escHtml(recText)+'</div>'
      +'<div class="hist-time">'+h.time+'</div>';
    el.onclick=function(){renderResult(h.result,h.symbol);document.getElementById('stockInput').value=h.symbol;};
    list.appendChild(el);
  });
}

/* ── TRANSLATION — תרגום נתונים לשפת הממשק ── */
var __trCache={};
async function trTexts(texts){
  if(curLang==='en'||!texts.length)return texts;
  var need=[],needIdx=[];
  texts.forEach(function(t,i){
    if(t&&__trCache[curLang+'|'+t]==null){need.push(t);needIdx.push(i);}
  });
  if(need.length){
    try{
      var res=await fetch(DATA_WORKER_URL+'/',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'translate',tl:curLang,texts:need})
      });
      var data=await res.json();
      if(data.ok&&data.translations){
        need.forEach(function(t,j){__trCache[curLang+'|'+t]=data.translations[j]||t;});
      }
    }catch(e){need.forEach(function(t){__trCache[curLang+'|'+t]=t;});}
  }
  return texts.map(function(t){return (t&&__trCache[curLang+'|'+t])||t;});
}

};

/* ── Number formatting ── */
function fmtNum(n){
  if(n==null||isNaN(n))return '—';
  if(Math.abs(n)>=1e12)return (n/1e12).toFixed(2)+'T';
  if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+'B';
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n*100)/100);
}
function fmtPrice(n,cur){
  if(n==null||isNaN(n))return '—';
  var sym=cur==='ILS'?'₪':cur==='EUR'?'€':cur==='GBP'?'£':'$';
  return sym+(Math.round(n*100)/100).toLocaleString();
}
function fmtPct(n){
  if(n==null||isNaN(n))return '';
  var v=Math.round(n*100)/100;
  return (v>=0?'+':'')+v+'%';
}

/* ── LIVE TICKER — מניות + מדדים, אנימציה שלא נשברת ── */
async function loadLiveTicker(){
  try{
    var results=await Promise.all([
      fetchLiveTicker(TICKER_SYMBOLS).catch(function(){return null;}),
      workerFetch('action=indices').catch(function(){return null;})
    ]);
    var tickerData=results[0],indicesData=results[1];
    var items=[];
    // Indices first (gold color, no click)
    if(indicesData&&indicesData.indices){
      indicesData.indices.forEach(function(ix){
        var color=ix.changePct>=0?'var(--green)':'var(--red)';
        items.push('<span class="ticker-item"><span style="color:var(--gold)">'+ix.name+'</span> <span data-lsp="'+ix.symbol+'" data-kind="num">'+fmtNum(ix.price)+'</span> <span data-lsc="'+ix.symbol+'" style="color:'+color+'">'+fmtPct(ix.changePct)+'</span></span>');
      });
    }
    // Stocks (clickable)
    if(tickerData&&tickerData.quotes){
      tickerData.quotes.forEach(function(q){
        var color=q.changePct>=0?'var(--green)':'var(--red)';
        items.push('<span class="ticker-item" style="cursor:pointer" onclick="quickLive(\''+q.symbol+'\')">'+q.symbol+' <span data-lsp="'+q.symbol+'">'+fmtPrice(q.price)+'</span> <span data-lsc="'+q.symbol+'" style="color:'+color+'">'+fmtPct(q.changePct)+'</span></span>');
      });
    }
    if(!items.length)return;
    // Duplicate content for seamless 50% loop, then RESTART the animation
    var track=document.getElementById('tickerTrack');
    track.style.animation='none';
    track.innerHTML=items.join('')+items.join('');
    try{localStorage.setItem('stockai_snap_ticker',items.join(''));}catch(e){}
    // Force reflow then re-apply animation — this is what keeps it running forever
    void track.offsetWidth;
    var duration=Math.max(30,items.length*4);
    track.style.animation='ticker '+duration+'s linear infinite';
  }catch(e){/* keep whatever is showing */}
}

var LIVE_TAB_DEFS=[
  ['overview','tabOverview',['lvChartWrap','lvMetrics']],
  ['technical','tabTech',['lvTech','lvTv']],
  ['analysts','tabAnalysts',['lvAnalyst','lvRecTrend','lvEarnHist','lvLastAction','lvInsiders']],
  ['quality','tabQuality',['lvQuality']],
  ['value','tabValue',['lvValue']],
  ['finance','tabFinance',['lvFinHist']],
  ['events','tabEvents',['lvEvents']],
  ['company','tabCompany',['lvCompany']],
  ['news','tabNews',['lvNews']],
  ['thesis','tabThesis',['lvThesis']]
];
var currentLiveTab='overview';
function sectionHas(id){
  if(id==='lvChartWrap'||id==='lvMetrics')return true;
  var el=document.getElementById(id);
  return !!(el&&el.innerHTML.trim());
}
function renderLiveTabs(){
  var bar=document.getElementById('liveTabs');if(!bar)return;
  bar.innerHTML='';
  LIVE_TAB_DEFS.forEach(function(def){
    // הצג טאב רק אם יש בו תוכן
    var hasContent=def[2].some(function(id){return sectionHas(id);});
    if(!hasContent)return;
    var b=document.createElement('button');
    b.className='live-tab'+(def[0]===currentLiveTab?' active':'');
    b.id='ltab-'+def[0];
    b.textContent=LT(def[1]);
    b.onclick=(function(t){return function(){switchLiveTab(t);};})(def[0]);
    bar.appendChild(b);
  });
}
function switchLiveTab(t){currentLiveTab=t;renderLiveTabs();applyLiveTabs();}
function applyLiveTabs(){
  LIVE_TAB_DEFS.forEach(function(def){
    var active=def[0]===currentLiveTab;
    def[2].forEach(function(id){
      var el=document.getElementById(id);if(!el)return;
      var disp=(id==='lvAnalyst')?'flex':(id==='lvMetrics')?'grid':'block';
      el.style.display=(active&&sectionHas(id))?disp:'none';
    });
  });
}

async function loadLiveData(symbol){
  symbol=(symbol||'').toUpperCase().trim();
  if(!symbol)return;
  currentLiveSymbol=symbol;
  var card=document.getElementById('liveCard');
  card.classList.add('visible');
  document.getElementById('lvSym').textContent=symbol;
  document.getElementById('lvName').textContent='...';
  document.getElementById('lvPrice').textContent='...';
  document.getElementById('lvChange').textContent='';
  document.getElementById('lvMetrics').innerHTML='';
  currentLiveTab='overview';
  ['lvAnalyst','lvCompany','lvNews','lvRecTrend','lvEarnHist','lvFinHist','lvLastAction','lvInsiders','lvTech','lvTv','lvQuality','lvEvents','lvValue','lvThesis'].forEach(function(id){
    var e=document.getElementById(id);if(e){e.innerHTML='';e.style.display='none';}
  });
  var __snap=snapGet(symbol);
  if(__snap){try{renderLiveQuote(__snap.q);document.getElementById('lvUpdated').textContent=P4('cached',{t:fmtTime(__snap.ts)});}catch(e){}}
  try{
    var q=await fetchLiveQuote(symbol);
    if(currentLiveSymbol!==symbol)return;
    snapSave(q);
    renderLiveQuote(q);
    streamFocus(q);
    loadLiveChart(symbol,currentChartRange);
    loadStockNews(symbol);
    renderValuation(symbol,q);renderThesis(symbol);
    // מנועי ניתוח — טכני, איכות, אירועים (חינמי, בלי AI)
    window.__extrasPromise=Promise.allSettled([loadTechnical(symbol).then(function(){return loadTvRating(symbol);}),loadQuality(symbol,q),loadEvents(symbol,q)]);
  }catch(e){
    if(__snap){document.getElementById('lvUpdated').textContent=P4('offline',{t:fmtTime(__snap.ts)});}
    else{document.getElementById('lvName').textContent=LT('dataErr');document.getElementById('lvPrice').textContent='—';}
  }
}

/* ── NEWS ── */
async function loadStockNews(symbol){
  try{
    var data=await workerFetch('action=news&symbol='+encodeURIComponent(symbol));
    if(!data.news||!data.news.length)return;
    var items=data.news.slice(0,5);
    // תרגום כותרות החדשות לשפת הממשק
    if(curLang!=='en'){
      var titles=items.map(function(n){return n.title||'';});
      var translated=await trTexts(titles);
      items.forEach(function(n,i){n.title=translated[i]||n.title;});
    }
    var el=document.getElementById('lvNews');
    var h='<div class="live-news-title">'+LT('newsTitle')+'</div>';
    items.forEach(function(n){
      var timeStr='';
      if(n.time){
        var mins=Math.floor((Date.now()-new Date(n.time).getTime())/60000);
        timeStr=mins<60?mins+'m':mins<1440?Math.floor(mins/60)+'h':Math.floor(mins/1440)+'d';
      }
      h+='<a class="news-item" href="'+escHtml(n.link)+'" target="_blank" rel="noopener">'
        +'<div class="news-title">'+escHtml(n.title)+'</div>'
        +'<div class="news-meta">'+escHtml(n.publisher||'')+(timeStr?' · '+timeStr:'')+'</div></a>';
    });
    el.innerHTML=h;
    renderLiveTabs();applyLiveTabs();
  }catch(e){/* news is optional */}
}

  var loading=document.getElementById('chartLoading');
  loading.style.display='flex';loading.textContent='◈ ...';
  try{
    var data=await fetchLiveChart(symbol,range);
    drawChart(data.points||[],data.previousClose);
    loading.style.display='none';
  }catch(e){loading.textContent=LT('dataErr');}
}
function drawChart(points,prevClose){
  var canvas=document.getElementById('liveChart');
  var wrap=canvas.parentElement;
  var dpr=window.devicePixelRatio||1;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  if(!points.length)return;
  var vals=points.map(function(p){return p[1];});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(min===max){min-=1;max+=1;}
  var pad=(max-min)*0.08;min-=pad;max+=pad;
  var isUp=vals[vals.length-1]>=vals[0];
  var lineColor=isUp?'#4caf72':'#cf4a4a';
  var mL=8,mR=54,mT=8,mB=18;
  var cw=W-mL-mR,chh=H-mT-mB;
  function px(i){return mL+(i/(points.length-1))*cw;}
  function py(v){return mT+(1-(v-min)/(max-min))*chh;}
  // grid lines + right axis labels
  ctx.strokeStyle='rgba(128,128,128,0.12)';ctx.fillStyle='rgba(150,140,110,0.7)';
  ctx.font='9px IBM Plex Mono,monospace';ctx.textAlign='left';
  for(var g=0;g<=3;g++){
    var gv=min+(max-min)*(g/3);var gy=py(gv);
    ctx.beginPath();ctx.moveTo(mL,gy);ctx.lineTo(mL+cw,gy);ctx.stroke();
    ctx.fillText(String(Math.round(gv*100)/100),mL+cw+5,gy+3);
  }
  // prev close dashed line
  if(prevClose!=null&&prevClose>min&&prevClose<max){
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(201,168,76,0.4)';
    ctx.beginPath();ctx.moveTo(mL,py(prevClose));ctx.lineTo(mL+cw,py(prevClose));ctx.stroke();
    ctx.setLineDash([]);
  }
  // gradient fill
  var grad=ctx.createLinearGradient(0,mT,0,mT+chh);
  grad.addColorStop(0,isUp?'rgba(76,175,114,0.22)':'rgba(207,74,74,0.22)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.moveTo(px(0),py(vals[0]));
  for(var i=1;i<points.length;i++)ctx.lineTo(px(i),py(vals[i]));
  ctx.lineTo(px(points.length-1),mT+chh);ctx.lineTo(px(0),mT+chh);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // line
  ctx.beginPath();ctx.moveTo(px(0),py(vals[0]));
  for(var j=1;j<points.length;j++)ctx.lineTo(px(j),py(vals[j]));
  ctx.strokeStyle=lineColor;ctx.lineWidth=1.8;ctx.stroke();
  // last point dot
  ctx.beginPath();ctx.arc(px(points.length-1),py(vals[vals.length-1]),3,0,Math.PI*2);
  ctx.fillStyle=lineColor;ctx.fill();
  // time labels (first + last)
  var isIntra=(currentChartRange==='1d'||currentChartRange==='5d');
  ctx.fillStyle='rgba(150,140,110,0.6)';ctx.textAlign='left';
  var d0=new Date(points[0][0]*1000),d1=new Date(points[points.length-1][0]*1000);
  function lbl(d){return isIntra?d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'):(d.getMonth()+1)+'/'+(''+d.getFullYear()).slice(2);}
  ctx.fillText(lbl(d0),mL,H-4);
  ctx.textAlign='right';ctx.fillText(lbl(d1),mL+cw,H-4);
}

var fxTab='forex',fxData=null,cryptoData=null;
function switchFxTab(tab){
  fxTab=tab;
  document.getElementById('fxtab-forex').classList.toggle('active',tab==='forex');
  document.getElementById('fxtab-crypto').classList.toggle('active',tab==='crypto');
  renderFx();
}
async function loadFxData(){
  document.getElementById('fxtab-forex').textContent=LT('forex');
  document.getElementById('fxtab-crypto').textContent=LT('crypto');
  try{fxData=await fetchLiveForex();}catch(e){fxData=null;}
  try{cryptoData=await fetchLiveCrypto();}catch(e){cryptoData=null;}
  renderFx();
}
function renderFx(){
  var el=document.getElementById('fxContent');
  if(fxTab==='forex'){
    if(!fxData){el.innerHTML='<div class="fx-loading">'+LT('dataErr')+'</div>';return;}
    var r=fxData.rates||{};
    var pairs=[['USD/ILS',r.ILS],['USD/EUR',r.EUR],['USD/GBP',r.GBP],['EUR/ILS',fxData.eurIls],['USD/JPY',r.JPY],['USD/CHF',r.CHF],['USD/CAD',r.CAD],['USD/RUB',r.RUB]];
    var h='<div class="fx-grid">';
    pairs.forEach(function(p){
      if(p[1]==null)return;
      h+='<div class="fx-cell"><div class="fx-pair">'+p[0]+'</div><div class="fx-rate">'+(Math.round(p[1]*10000)/10000)+'</div></div>';
    });
    h+='</div>';
    el.innerHTML=h;
  }else{
    if(!cryptoData){el.innerHTML='<div class="fx-loading">'+LT('dataErr')+'</div>';return;}
    var h2='<div class="fx-grid">';
    (cryptoData.coins||[]).forEach(function(c){
      var color=c.change24h>=0?'var(--green)':'var(--red)';
      h2+='<div class="fx-cell"><div class="fx-pair">'+c.symbol+'/USD</div><div class="fx-rate">'+fmtPrice(c.usd)+'</div><div class="fx-chg" style="color:'+color+'">'+fmtPct(c.change24h)+'</div></div>';
    });
    h2+='</div>';
    el.innerHTML=h2;
  }
}

function PT(k){var l=P1_T[curLang]||P1_T.en;return (l[k]!=null)?l[k]:(P1_T.en[k]!=null?P1_T.en[k]:P3(k));}
function PTf(k,o){var s=PT(k);for(var x in o)s=s.split('{'+x+'}').join(o[x]);return s;}

/* ── Math helpers ── */
function _ema(a,p){var k=2/(p+1),o=[],v=null;for(var i=0;i<a.length;i++){v=(v==null)?a[i]:a[i]*k+v*(1-k);o.push(v);}return o;}
function _sma(a,p){var o=[],s=0;for(var i=0;i<a.length;i++){s+=a[i];if(i>=p)s-=a[i-p];o.push(i>=p-1?s/p:null);}return o;}
function _wild(a,p){var o=[],v=null;for(var i=0;i<a.length;i++){v=(v==null)?a[i]:v+(a[i]-v)/p;o.push(v);}return o;}
function _last(a){for(var i=a.length-1;i>=0;i--)if(a[i]!=null&&!isNaN(a[i]))return a[i];return null;}
function _curSym(c){return c==='ILS'?'₪':c==='EUR'?'€':c==='GBP'?'£':'$';}
function _r2(x){return x==null?null:Math.round(x*100)/100;}

/* ══ TECHNICAL ENGINE (Vibe-Trading technical-basic, ported to JS) ══ */
function computeTechnical(ohlc){
  if(!ohlc||ohlc.length<60)return null;
  var o=ohlc.map(function(x){return x[1];}),h=ohlc.map(function(x){return x[2];}),l=ohlc.map(function(x){return x[3];}),c=ohlc.map(function(x){return x[4];}),v=ohlc.map(function(x){return x[5]||0;});
  var n=c.length,last=c[n-1];
  // Trend: EMA 12/26 + ADX 14 (Wilder)
  var e12=_ema(c,12),e26=_ema(c,26);
  var pdm=[0],mdm=[0],tr=[h[0]-l[0]];
  for(var i=1;i<n;i++){var up=h[i]-h[i-1],dn=l[i-1]-l[i];pdm.push(up>dn&&up>0?up:0);mdm.push(dn>up&&dn>0?dn:0);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));}
  var atr=_wild(tr,14),sp=_wild(pdm,14),sm=_wild(mdm,14),dx=[];
  for(i=0;i<n;i++){var pdi=atr[i]?100*sp[i]/atr[i]:0,mdi=atr[i]?100*sm[i]/atr[i]:0;dx.push((pdi+mdi)?100*Math.abs(pdi-mdi)/(pdi+mdi):0);}
  var adx=_last(_wild(dx,14));
  // RSI 14 (Wilder)
  var g=[0],ls=[0];for(i=1;i<n;i++){var d=c[i]-c[i-1];g.push(Math.max(d,0));ls.push(Math.max(-d,0));}
  var ag=_last(_wild(g,14)),al=_last(_wild(ls,14));var rsi=al===0?100:100-100/(1+ag/al);
  // Bollinger 20,2
  var win=c.slice(-20),mean=win.reduce(function(s,x){return s+x;},0)/20;
  var sd=Math.sqrt(win.reduce(function(s,x){return s+(x-mean)*(x-mean);},0)/20);
  var bbU=mean+2*sd,bbL=mean-2*sd,pctB=(bbU-bbL)?(last-bbL)/(bbU-bbL):0.5;
  // OBV + volume ratio
  var obv=[0];for(i=1;i<n;i++)obv.push(obv[i-1]+(c[i]>c[i-1]?v[i]:c[i]<c[i-1]?-v[i]:0));
  var obvSma=_last(_sma(obv,20)),obvUp=obv[n-1]>obvSma;
  var avgV=v.slice(-21,-1).reduce(function(s,x){return s+x;},0)/20,volRatio=avgV?v[n-1]/avgV:null;
  // MA 50/200 + crosses
  var s50=_sma(c,50),s200=n>=200?_sma(c,200):null,ma50=_last(s50),ma200=s200?_last(s200):null;
  var cross=null,crossRecent=false;
  if(s200){cross=ma50>ma200?'golden':'death';for(i=n-20;i<n;i++){if(i>0&&s200[i-1]!=null&&s50[i-1]!=null&&((s50[i-1]<=s200[i-1])!==(s50[i]<=s200[i]))){crossRecent=true;}}}
  // Voting
  var trendBull=_last(e12)>_last(e26),strong=adx>25;
  var trendS=(trendBull?1:-1)*(strong?1:0.5);
  var momS=rsi>70?-1:rsi<30?1:(rsi>55?0.25:rsi<45?-0.25:0);
  var flowS=obvUp?0.75:-0.75;
  var maS=ma200!=null?(last>ma200?0.5:-0.5):0;
  var score=trendS+momS+flowS+maS;
  var label=score>=2?'sigStrongBuy':score>=0.75?'sigBuy':score>-0.75?'sigNeutral':score>-2?'sigSell':'sigStrongSell';
  // Volatility (HV20 annualized + percentile)
  var rets=[];for(i=1;i<n;i++)rets.push(Math.log(c[i]/c[i-1]));
  var hv=[];for(i=19;i<rets.length;i++){var w=rets.slice(i-19,i+1),m=w.reduce(function(s,x){return s+x;},0)/20;hv.push(Math.sqrt(w.reduce(function(s,x){return s+(x-m)*(x-m);},0)/19)*Math.sqrt(252)*100);}
  var hvNow=hv[hv.length-1],hvWin=hv.slice(-120),hvPct=Math.round(hvWin.filter(function(x){return x<=hvNow;}).length/hvWin.length*100);
  return {score:_r2(score),label:label,trendBull:trendBull,adx:_r2(adx),adxStrong:strong,rsi:_r2(rsi),pctB:_r2(pctB),obvUp:obvUp,volRatio:_r2(volRatio),
    ma50:_r2(ma50),ma200:_r2(ma200),last:last,cross:cross,crossRecent:crossRecent,hv:_r2(hvNow),hvPct:hvPct,candles:detectCandles(ohlc)};
}

/* ══ CANDLESTICK PATTERNS — 15 patterns (Vibe-Trading candlestick, ported) ══ */
function detectCandles(ohlc){
  var n=ohlc.length,found=[];
  var bodies=ohlc.slice(-15).map(function(x){return Math.abs(x[4]-x[1]);}),avgBody=bodies.reduce(function(s,x){return s+x;},0)/bodies.length||1e-9;
  function C(i){var x=ohlc[i];var o=x[1],h=x[2],l=x[3],c=x[4];return {o:o,h:h,l:l,c:c,body:Math.abs(c-o),rng:(h-l)||1e-9,up:h-Math.max(o,c),lo:Math.min(o,c)-l,bull:c>o,bear:c<o,mid:(o+c)/2,t:x[0]};}
  for(var i=Math.max(3,n-5);i<n;i++){
    var a=C(i),b=C(i-1),z=C(i-2),downT=ohlc[i-1][4]<ohlc[Math.max(0,i-5)][4],upT=!downT,pats=[];
    if(a.body<=0.1*a.rng)pats.push(['doji','neutral']);
    else if(a.body<=0.3*a.rng&&a.up>a.body&&a.lo>a.body)pats.push(['spinningTop','neutral']);
    if(a.body>0&&a.lo>=2*a.body&&a.up<=0.5*a.body&&downT)pats.push(['hammer','bull']);
    if(a.body>0&&a.up>=2*a.body&&a.lo<=0.5*a.body&&downT)pats.push(['invHammer','bull']);
    if(a.body>0&&a.up>=2*a.body&&a.lo<=0.5*a.body&&upT)pats.push(['shootingStar','bear']);
    if(b.bear&&a.bull&&a.o<=b.c&&a.c>=b.o&&a.body>b.body)pats.push(['bullEngulf','bull']);
    if(b.bull&&a.bear&&a.o>=b.c&&a.c<=b.o&&a.body>b.body)pats.push(['bearEngulf','bear']);
    if(b.bear&&b.body>avgBody&&a.bull&&a.o>b.c&&a.c<b.o&&a.body<b.body*0.6)pats.push(['bullHarami','bull']);
    if(b.bull&&b.body>avgBody&&a.bear&&a.o<b.c&&a.c>b.o&&a.body<b.body*0.6)pats.push(['bearHarami','bear']);
    if(b.bear&&a.bull&&a.o<b.c&&a.c>b.mid&&a.c<b.o)pats.push(['piercing','bull']);
    if(b.bull&&a.bear&&a.o>b.c&&a.c<b.mid&&a.c>b.o)pats.push(['darkCloud','bear']);
    if(z.bear&&z.body>avgBody&&b.body<z.body*0.4&&a.bull&&a.c>z.mid)pats.push(['morningStar','bull']);
    if(z.bull&&z.body>avgBody&&b.body<z.body*0.4&&a.bear&&a.c<z.mid)pats.push(['eveningStar','bear']);
    if(z.bull&&b.bull&&a.bull&&b.c>z.c&&a.c>b.c&&b.o>z.o&&b.o<z.c&&a.o>b.o&&a.o<b.c)pats.push(['threeSoldiers','bull']);
    if(z.bear&&b.bear&&a.bear&&b.c<z.c&&a.c<b.c&&b.o<z.o&&b.o>z.c&&a.o<b.o&&a.o>b.c)pats.push(['threeCrows','bear']);
    pats.forEach(function(p){found.push({key:p[0],dir:p[1],t:a.t});});
  }
  return found.reverse();
}

/* ══ SEASONALITY — ממוצע תשואה לפי חודש (Vibe-Trading seasonal) ══ */
function computeSeasonality(ohlcMonthly){
  if(!ohlcMonthly||ohlcMonthly.length<14)return null;
  var buckets=[];for(var m=0;m<12;m++)buckets.push([]);
  for(var i=1;i<ohlcMonthly.length;i++){var r=ohlcMonthly[i][4]/ohlcMonthly[i-1][4]-1;var mo=new Date(ohlcMonthly[i][0]*1000).getUTCMonth();buckets[mo].push(r*100);}
  var avg=buckets.map(function(b){return b.length?b.reduce(function(s,x){return s+x;},0)/b.length:null;});
  var win=buckets.map(function(b){return b.length?Math.round(b.filter(function(x){return x>0;}).length/b.length*100):null;});
  var best=0,worst=0;avg.forEach(function(v,i){if(v!=null&&(avg[best]==null||v>avg[best]))best=i;if(v!=null&&(avg[worst]==null||v<avg[worst]))worst=i;});
  return {avg:avg,win:win,best:best,worst:worst};
}

/* ══ QUALITY SCREEN — 7 metrics + 3 exemptions (AI Berkshire quality-screen) ══ */
function computeQuality(years,q){
  // מסננים שנים חלקיות (יאהו מחזיר לפעמים שנה עם שדה אחד בלבד)
  years=(years||[]).filter(function(y){return Object.keys(y).length>=4;});
  if(!years.length)return null;
  var ys=years.slice(-5);
  function avg(arr){var a=arr.filter(function(x){return x!=null&&isFinite(x);});return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
  var isFin=q&&/financial/i.test(q.sector||'');
  var roe=avg(ys.map(function(y){return (y.netIncome!=null&&y.equity>0)?y.netIncome/y.equity:null;}));
  var fcfArr=ys.map(function(y){return y.fcf!=null?y.fcf:(y.ocf!=null&&y.capex!=null?y.ocf+y.capex:null);}).filter(function(x){return x!=null;});
  var fcfSum=fcfArr.length?fcfArr.reduce(function(s,x){return s+x;},0):null;
  var lastY=ys[ys.length-1],cov=null,noInt=false;
  // השנה האחרונה שיש בה גם רווח תפעולי וגם ריבית — חוסר דיווח אינו "אין ריבית"
  var anyIE=years.some(function(y){return y.interestExpense!=null;}),anyEB=ys.some(function(y){return y.ebit!=null;});
  for(var i=years.length-1;i>=0;i--){var yy=years[i];if(yy.ebit!=null&&yy.interestExpense!=null){cov=Math.abs(yy.interestExpense)<1?null:yy.ebit/Math.abs(yy.interestExpense);if(cov==null)noInt=true;break;}}
  if(cov==null&&!noInt&&anyEB&&!anyIE)noInt=true;
  var gm=avg(ys.map(function(y){return (y.grossProfit!=null&&y.revenue)?y.grossProfit/y.revenue:null;}));
  var ocfni=avg(ys.map(function(y){return (y.ocf!=null&&y.netIncome>0)?y.ocf/y.netIncome:null;}));
  var nmArr=ys.map(function(y){return (y.netIncome!=null&&y.revenue)?y.netIncome/y.revenue:null;});
  var nm=avg(nmArr);
  var sh=years.map(function(y){return y.shares||y.dilutedShares||null;}).filter(function(x){return x;});
  var dil=sh.length>=2?sh[sh.length-1]/sh[0]-1:null;
  function st(val,thr,higherGood){if(val==null)return 'na';var ok=higherGood?val>=thr:val<=thr;return ok?'pass':'fail';}
  function nearT(val,thr){return val!=null&&thr!==0&&Math.abs(val-thr)/Math.abs(thr)<0.1;}
  var m=[
    {k:'q1',v:roe,s:st(roe,0.08,true),near:nearT(roe,0.08),fmt:roe!=null?(roe*100).toFixed(1)+'%':'—'},
    {k:'q2',v:fcfSum,s:fcfSum==null?'na':(fcfSum>0?'pass':'fail'),fmt:fcfSum!=null?(fcfSum<0?'-':'')+_curSym(q&&q.currency)+fmtNum(Math.abs(fcfSum)):'—'},
    {k:'q3',v:cov,s:isFin?'na':noInt?'pass':st(cov,2,true),near:nearT(cov,2),fmt:isFin?'—':noInt?PT('noInterest'):cov!=null?cov.toFixed(1)+'x':'—'},
    {k:'q4',v:gm,s:isFin?'na':st(gm,0.15,true),near:nearT(gm,0.15),fmt:gm!=null?(gm*100).toFixed(1)+'%':'—'},
    {k:'q5',v:ocfni,s:ocfni==null?(ys.every(function(y){return !(y.netIncome>0);})?'fail':'na'):st(ocfni,0.7,true),near:nearT(ocfni,0.7),fmt:ocfni!=null?ocfni.toFixed(2):'—'},
    {k:'q6',v:nm,s:st(nm,0.05,true),near:nearT(nm,0.05),fmt:nm!=null?(nm*100).toFixed(1)+'%':'—'},
    {k:'q7',v:dil,s:st(dil,0.20,false),near:nearT(dil,0.20),fmt:dil!=null?fmtPct(dil*100):'—'}
  ];
  // Exemptions
  var ageY=q&&q.firstTradeDate?(Date.now()/1000-q.firstTradeDate)/31557600:99;
  var ocf2=ys.slice(-2).every(function(y){return y.ocf>0;});
  var lastNM=nmArr[nmArr.length-1],prevNM=nmArr[nmArr.length-2];
  if(m[0].s==='fail'&&ageY<10&&gm>0.30&&ocf2){m[0].s='exempt';m[0].ex='exA';}
  if(m[5].s==='fail'&&gm>0.30&&(lastNM>=0.05||(lastNM!=null&&prevNM!=null&&lastNM>prevNM))){m[5].s='exempt';m[5].ex='exB';}
  if(roe>0.20&&ocfni>1.0){[3,5].forEach(function(ix){if(m[ix].s==='fail'){m[ix].s='exempt';m[ix].ex='exC';}});}
  var fails=m.filter(function(x){return x.s==='fail';}).length,nas=m.filter(function(x){return x.s==='na';}).length,exs=m.filter(function(x){return x.s==='exempt';}).length;
  var verdict=(years.length<3||nas>=3)?'grey':fails>0?'fail':exs>0?'exempt':'pass';
  var epsA=years.filter(function(y){return y.netIncome>0&&(y.shares||y.dilutedShares);}).map(function(y){return y.netIncome/(y.dilutedShares||y.shares);});
  var epsCagr=epsA.length>=3?Math.pow(epsA[epsA.length-1]/epsA[0],1/(epsA.length-1))-1:null;
  return {metrics:m,fails:fails,verdict:verdict,span:[years[0].year,years[years.length-1].year],n:years.length,epsCagr:epsCagr};
}

function P3(k){var l=P3_T[curLang]||P3_T.en;return (l[k]!=null)?l[k]:(P3_T.en[k]!=null?P3_T.en[k]:k);}
function P3f(k,o){var s=P3(k);for(var x in o)s=s.split('{'+x+'}').join(o[x]);return s;}

/* ══ FAIR VALUE ENGINE ══ */
function fvValue(st,g1){
  var E0=st.E0,R=st.R,r=st.r,gT=st.gT,N=st.N;
  if(r-gT<=0.005)return null;
  var p1=Math.max(0,Math.min(1,1-g1/R)),pT=Math.max(0.05,Math.min(1,1-gT/R));
  var peT=pT/(r-gT),v=0,e=E0;
  for(var t=1;t<=N;t++){e=e*(1+g1);v+=e*p1/Math.pow(1+r,t);}
  v+=peT*e*(1+gT)/Math.pow(1+r,N);
  return v;
}
function fvImplied(st){
  var lo=-0.3,hi=1.0,flo=fvValue(st,lo)-st.P,fhi=fvValue(st,hi)-st.P;
  if(flo==null||fhi==null||flo*fhi>0)return null;
  for(var i=0;i<60;i++){var m=(lo+hi)/2,fm=fvValue(st,m)-st.P;if(fm*flo>0){lo=m;flo=fm;}else hi=m;}
  return (lo+hi)/2;
}
function fvDefaults(q){
  var qr=window.__qualityResult&&window.__qualityResult.symbol===q.symbol?window.__qualityResult:null;
  var roe=null,g=null;
  if(qr){var m=qr.res.metrics[0];roe=m.v;g=qr.res.epsCagr;}
  if(roe==null)roe=q.returnOnEquity;
  if(g==null)g=q.revenueGrowth;
  return {R:Math.max(0.05,Math.min(0.40,roe!=null?roe:0.12)),g1:Math.max(-0.05,Math.min(0.30,g!=null?g:0.05)),r:0.10,gT:0.025,N:5};
}
function renderValuation(symbol,q){
  var el=document.getElementById('lvValue');if(!el||!q)return;
  if(!(q.eps>0)||!(q.regularPrice>0)||q.currency==='ILA'){el.innerHTML='<div class="rec-trend-title">'+P3('valT')+'</div><div class="ta-small">'+P3('valNA')+'</div>';renderLiveTabs();applyLiveTabs();window.__fvState=null;return;}
  var d=fvDefaults(q);
  window.__fvState={symbol:symbol,P:q.regularPrice,E0:q.eps,cur:q.currency,R:d.R,g1:d.g1,r:d.r,gT:d.gT,N:d.N,def:d};
  function sl(id,lbl,min,max,step,val){return '<div class="fv-sl"><label>'+lbl+' <strong id="fvv-'+id+'"></strong></label><input type="range" id="fvs-'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" oninput="fvInput()"></div>';}
  var st=window.__fvState;
  el.innerHTML='<div class="rec-trend-title">'+P3('valT')+'</div><div id="fvOut"></div>'
    +'<div class="fv-sliders">'
    +sl('g1',P3('sGrowth'),-5,30,0.5,(st.g1*100).toFixed(1))
    +sl('R',P3('sROIC'),5,40,1,Math.round(st.R*100))
    +sl('r',P3('sR'),6,15,0.5,(st.r*100).toFixed(1))
    +sl('gT',P3('sGT'),0,4,0.25,(st.gT*100).toFixed(2))
    +'<div class="fv-sl"><label>'+P3('sYears')+'</label><div class="fv-years"><button id="fvy5" onclick="fvYears(5)">5</button><button id="fvy10" onclick="fvYears(10)">10</button></div></div>'
    +'<button class="fv-reset" onclick="fvReset()">'+P3('reset')+'</button></div>'
    +'<div class="ta-note">'+P3('valNote')+'</div>';
  fvDraw();renderLiveTabs();applyLiveTabs();
}
function fvInput(){var st=window.__fvState;if(!st)return;
  st.g1=+document.getElementById('fvs-g1').value/100;st.R=+document.getElementById('fvs-R').value/100;
  st.r=+document.getElementById('fvs-r').value/100;st.gT=+document.getElementById('fvs-gT').value/100;fvDraw();}
function fvYears(n){if(window.__fvState){window.__fvState.N=n;fvDraw();}}
function fvReset(){var st=window.__fvState;if(!st)return;var d=st.def;
  st.g1=d.g1;st.R=d.R;st.r=d.r;st.gT=d.gT;st.N=d.N;
  document.getElementById('fvs-g1').value=(d.g1*100).toFixed(1);document.getElementById('fvs-R').value=Math.round(d.R*100);
  document.getElementById('fvs-r').value=(d.r*100).toFixed(1);document.getElementById('fvs-gT').value=(d.gT*100).toFixed(2);fvDraw();}
function fvScen(st){
  var g=st.g1,bear=g>0?g*0.5:g*1.5,bull=Math.min(0.40,g>0?g*1.5:g*0.5);
  return [['vBear',bear],['vBase',g],['vBull',bull]].map(function(s){return {k:s[0],g:s[1],v:fvValue(st,s[1])};});
}
function fvDraw(){
  var st=window.__fvState,out=document.getElementById('fvOut');if(!st||!out)return;
  document.getElementById('fvv-g1').textContent=(st.g1*100).toFixed(1)+'%';document.getElementById('fvv-R').textContent=Math.round(st.R*100)+'%';
  document.getElementById('fvv-r').textContent=(st.r*100).toFixed(1)+'%';document.getElementById('fvv-gT').textContent=(st.gT*100).toFixed(2)+'%';
  ['5','10'].forEach(function(n){var b=document.getElementById('fvy'+n);if(b)b.className=(String(st.N)===n)?'active':'';});
  var cards='';
  fvScen(st).forEach(function(s){
    if(s.v==null){cards+='<div class="fv-card"><div class="profile-name">'+P3(s.k)+'</div><div class="fv-val">—</div></div>';return;}
    var mos=(s.v/st.P-1)*100,col=mos>=15?'var(--green)':mos>=-10?'var(--gold)':'var(--red)';
    cards+='<div class="fv-card" style="border-top-color:'+col+'"><div class="profile-name">'+P3(s.k)+' · '+(s.g*100).toFixed(1)+'%</div>'
      +'<div class="fv-val">'+fmtPrice(s.v,st.cur)+'</div><div class="fv-mos" style="color:'+col+'">'+fmtPct(mos)+' '+P3('vsPrice')+'</div></div>';
  });
  var ig=fvImplied(st);
  var impl=ig!=null?P3f('implied',{g:'<strong>'+(ig*100).toFixed(1)+'%</strong>',n:st.N}):P3('impliedNA');
  out.innerHTML='<div class="fv-cards">'+cards+'</div><div class="fv-implied">'+impl+'</div>'
    +((st.r-st.gT)<0.05?'<div class="fv-warn">'+P3('spreadWarn')+'</div>':'');
}

/* ══ THESIS JOURNAL (AI Berkshire thesis-tracker / thesis-drift) ══ */
function thLoad(){try{return JSON.parse(localStorage.getItem('stockai_thesis'))||{};}catch(e){return {};}}
function thSaveAll(o){try{localStorage.setItem('stockai_thesis',JSON.stringify(o));}catch(e){}}
function renderThesis(symbol){
  var el=document.getElementById('lvThesis');if(!el)return;
  var all=thLoad(),t=all[symbol],q=window.__lastLiveQuote,price=q&&q.symbol===symbol?q.regularPrice:null,cur=q&&q.currency;
  var h='<div class="rec-trend-title">'+P3('thT')+'</div>';
  if(!t||t.editing){
    var e=t||{};
    h+='<div class="ta-small" style="margin-bottom:10px">'+P3('thEmpty')+'</div>'
      +'<label class="th-lbl">'+P3('thWhy')+'</label><textarea class="key-input th-ta" id="thWhy" rows="3" placeholder="'+escHtml(P3('thWhyPh'))+'">'+escHtml(e.why||'')+'</textarea>'
      +'<label class="th-lbl">'+P3('thKill')+'</label><textarea class="key-input th-ta" id="thKill" rows="2" placeholder="'+escHtml(P3('thKillPh'))+'">'+escHtml(e.kill||'')+'</textarea>'
      +'<label class="th-lbl">'+P3('thEntry')+'</label><input class="key-input" id="thEntry" type="number" step="any" value="'+(e.entry!=null?e.entry:(price!=null?price:''))+'">'
      +'<button class="btn-ai-analyze" style="margin-top:10px;width:100%" onclick="thSave(\''+symbol+'\')">'+P3('thSave')+'</button>';
  }else{
    var days=Math.floor((Date.now()-new Date(t.date).getTime())/86400000);
    var chg=(price!=null&&t.entry)?(price/t.entry-1)*100:null;
    h+='<div class="th-card"><div class="th-meta">'+P3('thWritten')+': '+escHtml(t.date.slice(0,10))+' · '+P3f('thDays',{n:days})
      +(t.entry?' · '+fmtPrice(t.entry,cur):'')+(chg!=null?' · '+P3('thSince')+': <strong style="color:'+(chg>=0?'var(--green)':'var(--red)')+'">'+fmtPct(chg)+'</strong>':'')+'</div>'
      +'<div class="th-why">'+escHtml(t.why).replace(/\n/g,'<br>')+'</div>'
      +(t.kill?'<div class="th-kill"><strong>'+P3('thKill')+'</strong> '+escHtml(t.kill).replace(/\n/g,'<br>')+'</div>':'')
      +'<div class="th-btns"><button onclick="thEdit(\''+symbol+'\')">'+P3('thEdit')+'</button><button onclick="thDelete(\''+symbol+'\')">'+P3('thDel')+'</button></div></div>'
      +'<button class="btn-ai-analyze" id="thCheckBtn" style="margin-top:10px;width:100%" onclick="thCheck(\''+symbol+'\')">'+P3('thCheck')+'</button>'
      +'<div id="thResult">'+(t.check?thResultHtml(t.check):'')+'</div>';
  }
  el.innerHTML=h;
}
function thSave(symbol){
  var why=(document.getElementById('thWhy').value||'').trim();if(!why)return;
  var all=thLoad(),old=all[symbol]||{};
  var entry=parseFloat(document.getElementById('thEntry').value);
  all[symbol]={why:why,kill:(document.getElementById('thKill').value||'').trim(),entry:isFinite(entry)?entry:null,date:old.date||new Date().toISOString(),check:old.check||null};
  thSaveAll(all);renderThesis(symbol);
}
function thEdit(symbol){var all=thLoad();if(all[symbol]){all[symbol].editing=true;thSaveAll(all);renderThesis(symbol);delete all[symbol].editing;thSaveAll(all);}}
function thDelete(symbol){if(!confirm(P3('thDelQ')))return;var all=thLoad();delete all[symbol];thSaveAll(all);renderThesis(symbol);}
function thResultHtml(c){
  var col=c.status==='INTACT'?'var(--green)':c.status==='BROKEN'?'var(--red)':'var(--gold)';
  return '<div class="th-res" style="border-color:'+col+'"><div class="th-res-st" style="color:'+col+'">'+P3('st'+c.status)+'</div>'
    +'<div class="th-res-sum">'+escHtml(c.summary||'')+'</div>'
    +(c.triggered&&c.triggered.length?'<div class="th-res-trig"><strong>'+P3('thTrig')+':</strong>'+c.triggered.map(function(x){return '<div>• '+escHtml(x)+'</div>';}).join('')+'</div>':'')
    +(c.points&&c.points.length?'<ul class="th-res-pts">'+c.points.map(function(x){return '<li>'+escHtml(x)+'</li>';}).join('')+'</ul>':'')
    +'<div class="ta-small">'+P3('thLast')+': '+escHtml((c.ts||'').slice(0,16).replace('T',' '))+'</div></div>';
}

/* Generic AI JSON call — uses the user's own provider & keys */
async function aiCompleteJSON(system,user){
  return parseAIResponse(await aiText(system,user,{maxTokens:2000}));
}

async function thCheck(symbol){
  var box=document.getElementById('thResult'),btn=document.getElementById('thCheckBtn');
  if(!loadAIConfig().provider){box.innerHTML='<div class="fv-warn">'+P3('thNoAI')+'</div>';return;}
  var t=thLoad()[symbol];if(!t)return;
  btn.disabled=true;box.innerHTML='<div class="ta-small">⏳ '+P3('thChecking')+'</div>';
  var lang=AI_LANG_NAMES[curLang]||'English';
  var system='You are a disciplined investment reviewer using the AI-Berkshire thesis-drift method. Compare the investor\'s ORIGINAL thesis and exit (kill) criteria against CURRENT facts. Be honest, specific and unsentimental — the goal is to stop the investor from falling in love with a stock. Return ONLY a JSON object (no markdown): {"status":"INTACT","summary":"2 sentences","triggered":["kill criteria that are now met"],"points":["evidence 1","evidence 2","evidence 3"]}. status must be INTACT, WEAKENING or BROKEN. triggered is an empty array if none. Write summary, triggered and points in '+lang+'.';
  var user='STOCK: '+symbol+'\nTHESIS written '+t.date.slice(0,10)+(t.entry?' at price '+t.entry:'')+':\n'+t.why+'\nEXIT CRITERIA: '+(t.kill||'(none stated)')+'\n\nCURRENT DATA:\n'+buildLiveContext(symbol);
  try{
    var res=await aiCompleteJSON(system,user);
    var st=String(res.status||'').toUpperCase();if(['INTACT','WEAKENING','BROKEN'].indexOf(st)<0)st='WEAKENING';
    var c={status:st,summary:res.summary||'',triggered:res.triggered||[],points:res.points||[],ts:new Date().toISOString()};
    var all=thLoad();if(all[symbol]){all[symbol].check=c;thSaveAll(all);}
    box.innerHTML=thResultHtml(c);
  }catch(err){
    var em=String(err.message||'');
    box.innerHTML='<div class="fv-warn">'+(/quota|429|exhaust|rate.?limit|overload|503/i.test(em)?(QUOTA_T[curLang]||QUOTA_T.en):escHtml(em))+'</div>';
  }finally{btn.disabled=false;}
}

/* Extra AI context: fair value + the investor's thesis */
function buildPhase3Context(symbol){
  var out=[],st=window.__fvState;
  if(st&&st.symbol===symbol){var base=fvValue(st,st.g1),ig=fvImplied(st);
    if(base)out.push('FAIR VALUE (code-computed, base case, EPS growth '+(st.g1*100).toFixed(1)+'%, ROIC '+Math.round(st.R*100)+'%, r '+(st.r*100)+'%): '+base.toFixed(2)+' vs price '+st.P+(ig!=null?'; the price implies '+(ig*100).toFixed(1)+'% annual EPS growth for '+st.N+' years':''));}
  var t=thLoad()[symbol];
  if(t)out.push('INVESTOR THESIS: '+t.why+(t.kill?' | EXIT IF: '+t.kill:''));
  return out.length?'\n'+out.join('\n')+'\n':'';
}

/* ══ 1. KEY ENCRYPTION — AES-GCM 256, CryptoKey לא-ניתן-לייצוא ב-IndexedDB ══ */
var __keyCache={},__secureMode='none',KEY_PROVIDERS=['claude','openai','gemini','custom'];
function _idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('stockai_secure',1);r.onupgradeneeded=function(){r.result.createObjectStore('keys');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function _idbGet(db,k){return new Promise(function(res,rej){var q=db.transaction('keys','readonly').objectStore('keys').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function _idbPut(db,k,v){return new Promise(function(res,rej){var tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});}
var __cryptoKeyP=null;
function _cryptoKey(){
  if(!__cryptoKeyP)__cryptoKeyP=(async function(){var db=await _idb(),k=await _idbGet(db,'aes');
    if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await _idbPut(db,'aes',k);}return k;})();
  return __cryptoKeyP;
}
function _b64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function _unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function _enc(txt){var k=await _cryptoKey(),iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(txt));return JSON.stringify({iv:_b64(iv),ct:_b64(ct)});}
async function _dec(j){var o=JSON.parse(j),k=await _cryptoKey();var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(o.iv)},k,_unb64(o.ct));return new TextDecoder().decode(pt);}
function secureAvailable(){return !!(window.crypto&&crypto.subtle&&window.indexedDB&&window.isSecureContext!==false);}
async function secureInit(){
  if(!secureAvailable()){__secureMode='plain';return;}
  try{
    for(var i=0;i<KEY_PROVIDERS.length;i++){
      var p=KEY_PROVIDERS[i],enc=localStorage.getItem('stockai_enc_'+p),plain=localStorage.getItem('stockai_key_'+p);
      if(enc){try{__keyCache[p]=await _dec(enc);}catch(e){}}
      if(plain){ // מיגרציה: מוחקים את הטקסט הגלוי רק אחרי שההצפנה אומתה
        var e2=await _enc(plain);if((await _dec(e2))===plain){localStorage.setItem('stockai_enc_'+p,e2);__keyCache[p]=plain;localStorage.removeItem('stockai_key_'+p);}
      }
    }
    __secureMode='enc';
  }catch(e){__secureMode='plain';}

/* מחירים במניות ת"א מגיעים באגורות (ILA) — מציגים בשקלים */
fmtPrice=function(n,cur){
  if(n==null||isNaN(n))return '—';
  if(cur==='ILA'){n=n/100;cur='ILS';}
  var sym=cur==='ILS'?'₪':cur==='EUR'?'€':cur==='GBP'?'£':'$';
  var d=Math.abs(n)<1?4:2;
  return sym+(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString(undefined,{maximumFractionDigits:d});
};

/* ══ 1. PROTOBUF DECODER — PricingData (לפי pricing_pb2 של yfinance) ══ */
var PB_FIELDS={1:['id','s'],2:['price','f'],3:['time','z'],4:['currency','s'],5:['exchange','s'],6:['quoteType','i'],7:['marketHours','i'],8:['changePercent','f'],9:['dayVolume','z'],10:['dayHigh','f'],11:['dayLow','f'],12:['change','f'],13:['shortName','s'],15:['openPrice','f'],16:['previousClose','f'],23:['bid','f'],25:['ask','f'],27:['priceHint','z']};
function pbDecode(b64){
  var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  var dv=new DataView(u.buffer),p=0,out={};
  function varint(){var r=0,m=1,b;do{b=u[p++];r+=(b&0x7f)*m;m*=128;}while(b&0x80&&p<u.length);return r;}
  while(p<u.length){
    var tag=varint(),fn=Math.floor(tag/8),wt=tag%8,def=PB_FIELDS[fn],val;
    if(wt===0){val=varint();if(def&&def[1]==='z')val=(val%2)?-(val+1)/2:val/2;}
    else if(wt===5){val=dv.getFloat32(p,true);p+=4;}
    else if(wt===1){val=dv.getFloat64(p,true);p+=8;}
    else if(wt===2){var len=varint();val=new TextDecoder().decode(u.subarray(p,p+len));p+=len;}
    else break;
    if(def)out[def[0]]=val;
  }
  return out;
}

/* ══ 2. LIVE STREAM — ישיר ← דרך ה-Worker ← רענון רגיל (בלי סיכון) ══ */
var LS={ws:null,mode:0,got:false,timer:null,hb:null,retry:0,prices:{},state:'off'};
function lsUrls(){return ['wss://streamer.finance.yahoo.com/?version=2',DATA_WORKER_URL.replace(/^https/,'wss')+'/?action=stream'];}
function lsSymbols(){
  var s=['^GSPC','^IXIC','^DJI','GC=F','CL=F','^VIX','BTC-USD','ETH-USD','SOL-USD','XRP-USD'].concat(TICKER_SYMBOLS);
  if(currentLiveSymbol&&!/\.TA$/.test(currentLiveSymbol))s.unshift(currentLiveSymbol);
  var out=[];s.forEach(function(x){if(x&&out.indexOf(x)<0&&!/\.TA$/.test(x))out.push(x);});return out.slice(0,40);
}
function lsConnect(){
  if(document.hidden||!('WebSocket' in window))return;
  if(LS.ws&&(LS.ws.readyState===0||LS.ws.readyState===1))return;
  var urls=lsUrls();if(LS.mode>=urls.length){LS.state='off';lsBadge();return;}
  var ws;try{ws=new WebSocket(urls[LS.mode]);}catch(e){LS.mode++;return setTimeout(lsConnect,500);}
  LS.ws=ws;LS.got=false;LS.state='connecting';
  ws.onopen=function(){lsSubscribe();clearInterval(LS.hb);LS.hb=setInterval(lsSubscribe,15000);
    clearTimeout(LS.timer);LS.timer=setTimeout(function(){if(!LS.got){try{ws.close();}catch(e){}}},12000);};
  ws.onmessage=function(ev){
    try{var m=JSON.parse(ev.data);if(!m.message)return;var d=pbDecode(m.message);if(!d.id||!d.price)return;
      if(!LS.got){LS.got=true;LS.retry=0;LS.state='live';}lsApply(d);}catch(e){}
  };
  ws.onclose=function(){clearInterval(LS.hb);LS.ws=null;
    if(!LS.got)LS.mode++;                       // לא הגיע אף מחיר → לנסות את הדרך הבאה
    LS.state='off';lsBadge();
    if(document.hidden)return;
    var wait=LS.got?Math.min(30000,2000*Math.pow(2,LS.retry++)):800;
    setTimeout(lsConnect,wait);
  };
  ws.onerror=function(){};
}
function lsSubscribe(){if(LS.ws&&LS.ws.readyState===1)try{LS.ws.send(JSON.stringify({subscribe:lsSymbols()}));}catch(e){}}
function lsRefocus(){lsSubscribe();}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(LS.ws)try{LS.ws.close();}catch(e){}}
  else{LS.mode=0;LS.retry=0;setTimeout(lsConnect,300);}
});
function lsApply(d){
  var sym=d.id,price=d.price,prev=LS.prices[sym];LS.prices[sym]=price;
  var dir=prev==null?0:price>prev?1:price<prev?-1:0;
  // טיקר
  document.querySelectorAll('[data-lsp="'+cssEsc(sym)+'"]').forEach(function(el){
    el.textContent=(el.getAttribute('data-kind')==='num')?fmtNum(price):fmtPrice(price);if(dir)lsFlash(el,dir);});
  if(d.changePercent!=null)document.querySelectorAll('[data-lsc="'+cssEsc(sym)+'"]').forEach(function(el){
    el.textContent=fmtPct(d.changePercent);el.style.color=d.changePercent>=0?'var(--green)':'var(--red)';});
  // כרטיס המניה
  if(sym===currentLiveSymbol){
    var q=window.__lastLiveQuote;
    var pe=document.getElementById('lvPrice');if(pe){pe.textContent=fmtPrice(price,q&&q.currency);if(dir)lsFlash(pe,dir);}
    var ce=document.getElementById('lvChange');
    if(ce&&d.change!=null&&d.changePercent!=null){var up=d.change>=0;ce.textContent=(up?'▲ +':'▼ ')+(Math.round(d.change*100)/100)+' ('+fmtPct(d.changePercent)+')';ce.className='live-change '+(up?'up':'down');}
    if(q&&q.symbol===sym){q.regularPrice=price;if(d.changePercent!=null)q.regularChangePct=d.changePercent;}
    lsBadge();
  }
}
function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&');}
function lsFlash(el,dir){el.classList.remove('ls-up','ls-down');void el.offsetWidth;el.classList.add(dir>0?'ls-up':'ls-down');}
function lsBadge(){
  var b=document.getElementById('lvLive');if(!b)return;
  if(currentLiveSymbol&&/\.TA$/.test(currentLiveSymbol)){b.className='live-badge delayed';b.textContent=P5('delayed');return;}
  var isLive=LS.state==='live'&&LS.prices[currentLiveSymbol]!=null;
  b.className='live-badge'+(isLive?' on':'');b.textContent=isLive?'● '+P5('live'):'';
}
function streamFocus(q){if(q&&q.symbol===currentLiveSymbol){lsBadge();lsRefocus();}}

    box.innerHTML=d.items.map(function(it){
      var c=it.changePct>=0?'var(--green)':'var(--red)';
      return '<div class="mk-row" onclick="closeModal(\'marketOverlay\');quickLive(\''+escHtml(it.symbol)+'\')">'
        +'<div class="mk-sym">'+escHtml(it.symbol.replace(/\.TA$/,''))+'</div><div class="mk-name">'+escHtml(it.name||'')+'</div>'
        +'<div class="mk-px">'+fmtPrice(it.price,it.currency)+'</div><div class="mk-chg" style="color:'+c+'">'+fmtPct(it.changePct)+'</div>'
        +'<div class="mk-vol">'+(it.volume?fmtNum(it.volume):'')+'</div></div>';
    }).join('')+'<div class="ta-note">'+note+'</div>';
  }catch(e){box.innerHTML='<div class="fv-warn">'+P5('err')+'</div>';}
}
function flagOf(cc){cc=String(cc||'').toUpperCase();if(cc==='EZ'||cc==='EMU')cc='EU';if(!/^[A-Z]{2}$/.test(cc))return '🌐';return String.fromCodePoint(0x1F1E6+cc.charCodeAt(0)-65,0x1F1E6+cc.charCodeAt(1)-65);}
function dayLabel(dt){var d=new Date(dt),t=new Date();t.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);var diff=Math.round((x-t)/86400000);
  return diff===0?P5('today'):diff===1?P5('tomorrow'):d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'numeric'});}
function calNum(v){if(v==null||v==='')return '—';var n=Number(v);return isFinite(n)?String(Math.round(n*1000)/1000):escHtml(String(v));}
async function mkLoadEcon(){
  var box=document.getElementById('mkList');
  try{
    var d=await mkFetch('econ','action=calendar&type=economic_event&days=7');if(!document.getElementById('mkList'))return;
    var rows=(d.rows||[]).filter(function(r){var cc=String(r.country_code||'').toUpperCase();if(MK.econCountry==='all')return true;if(MK.econCountry==='EU')return ['EU','EZ','EMU','DE','FR','IT','ES'].indexOf(cc)>-1;return cc===MK.econCountry;});
    if(!rows.length){box.innerHTML='<div class="ta-small">'+P5('empty')+'</div>';return;}
    rows.sort(function(a,b){return new Date(a.startdatetime)-new Date(b.startdatetime);});
    var names=rows.map(function(r){return r.econ_release||'';}),tr=await trTexts(names);
    var h='',lastDay='';
    rows.slice(0,80).forEach(function(r,i){
      var dl=dayLabel(r.startdatetime);if(dl!==lastDay){h+='<div class="mk-day">'+dl+'</div>';lastDay=dl;}
      var t=new Date(r.startdatetime),tm=isNaN(t)?'':String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
      var act=r.after_release_actual,est=r.consensus_estimate,beat=(act!=null&&act!==''&&est!=null&&est!=='')?(Number(act)>=Number(est)):null;
      h+='<div class="ec-row"><div class="ec-time">'+tm+'</div><div class="ec-flag">'+flagOf(r.country_code)+'</div>'
        +'<div class="ec-main"><div class="ec-name">'+escHtml(tr[i]||r.econ_release||'')+(r.period?' <em>'+escHtml(r.period)+'</em>':'')+'</div>'
        +'<div class="ec-vals"><span>'+P5('forecast')+': <b>'+calNum(est)+'</b></span><span>'+P5('actual')+': <b style="color:'+(beat==null?'var(--text)':beat?'var(--green)':'var(--red)')+'">'+calNum(act)+'</b></span><span>'+P5('prior')+': '+calNum(r.prior_release_actual)+'</span></div></div></div>';
    });
    box.innerHTML=h+'<div class="ta-note">'+P5('econNote')+'</div>';
  }catch(e){box.innerHTML='<div class="fv-warn">'+P5('err')+'</div>';}
}
async function mkLoadEarn(){
  var box=document.getElementById('mkList');
  try{
    var d=await mkFetch('earn','action=calendar&type=sp_earnings&days=14');if(!document.getElementById('mkList'))return;
    var rows=(d.rows||[]).filter(function(r){return r.ticker;});
    if(!rows.length){box.innerHTML='<div class="ta-small">'+P5('empty')+'</div>';return;}
    rows.sort(function(a,b){return new Date(a.startdatetime)-new Date(b.startdatetime)||((b.intradaymarketcap||0)-(a.intradaymarketcap||0));});
    var h='',lastDay='';
    rows.slice(0,100).forEach(function(r){
      var dl=dayLabel(r.startdatetime);if(dl!==lastDay){h+='<div class="mk-day">'+dl+'</div>';lastDay=dl;}
      var tt=String(r.startdatetimetype||'').toUpperCase(),when=tt==='BMO'?P5('bmo'):tt==='AMC'?P5('amc'):P5('tbd');
      var sp=r.epssurprisepct,spc=sp==null||sp===''?'':(Number(sp)>=0?'var(--green)':'var(--red)');
      h+='<div class="mk-row" onclick="closeModal(\'marketOverlay\');quickLive(\''+escHtml(r.ticker)+'\')">'
        +'<div class="mk-sym">'+escHtml(r.ticker)+'</div><div class="mk-name">'+escHtml(r.companyshortname||'')+'<br><em>'+when+'</em></div>'
        +'<div class="mk-px">'+P5('earnEst')+'<br><b>'+calNum(r.epsestimate)+'</b></div>'
        +'<div class="mk-chg">'+(r.epsactual!=null&&r.epsactual!==''?P5('earnAct')+'<br><b style="color:'+spc+'">'+calNum(r.epsactual)+'</b>':'')+'</div>'
        +'<div class="mk-vol">'+(r.intradaymarketcap?fmtNum(r.intradaymarketcap):'')+'</div></div>';
    });
    box.innerHTML=h+'<div class="ta-note">'+P5('earnNote')+'</div>';
  }catch(e){box.innerHTML='<div class="fv-warn">'+P5('err')+'</div>';}
}

/* ══ 4. BANK OF ISRAEL — שער יציג רשמי בטאב המט"ח ══ */

/* ══ 5. SECOND OPINION — דירוג טכני של TradingView מול האיתות שלנו ══ */
function tvLabel(v){return v>=0.5?'sigStrongBuy':v>=0.1?'sigBuy':v>-0.1?'sigNeutral':v>-0.5?'sigSell':'sigStrongSell';}
function tvDir(v){return v>=0.1?1:v<=-0.1?-1:0;}
async function loadTvRating(symbol){
  var el=document.getElementById('lvTv');if(!el)return;window.__tvResult=null;
  try{
    var d=await workerFetch('action=tvrating&symbol='+encodeURIComponent(symbol));
    if(currentLiveSymbol!==symbol||!d.ok)return;
    window.__tvResult={symbol:symbol,d:d};
    var col=d.all>=0.1?'var(--green)':d.all>-0.1?'var(--gold)':'var(--red)';
    var t=window.__techResult,agree='';
    if(t&&t.symbol===symbol&&t.tech){
      var ours=t.tech.score>=0.75?1:t.tech.score<=-0.75?-1:0,theirs=tvDir(d.all);
      agree=ours===theirs?P5('tvAgree'):(ours*theirs<0?P5('tvDisagree'):P5('tvPartial'));
    }
    function mini(lbl,v){var c=v>=0.1?'var(--green)':v>-0.1?'var(--gold)':'var(--red)';return '<div class="ta-dim"><div class="ta-dim-lbl">'+lbl+'</div><div class="ta-dim-val" style="color:'+c+'">'+PT(tvLabel(v))+'</div></div>';}
    el.innerHTML='<div class="rec-trend-title">'+P5('tvT')+'</div>'
      +'<div class="ta-verdict" style="border-color:'+col+'"><div class="ta-verdict-lbl" style="color:'+col+'">'+PT(tvLabel(d.all))+' <span style="font-size:11px;opacity:.7">('+d.all+')</span></div>'
      +(agree?'<div class="ta-small" style="margin-top:0">'+agree+'</div>':'')+'</div>'
      +'<div class="ta-dims" style="grid-template-columns:1fr 1fr">'+mini(P5('tvMA'),d.ma)+mini(P5('tvOsc'),d.osc)+'</div>'
      +'<div class="ta-note">'+P5('tvNote')+'</div>';
    renderLiveTabs();applyLiveTabs();
  }catch(e){}
}
var __origExtraCtx=buildExtraContext;
buildExtraContext=function(symbol){
  var s=__origExtraCtx(symbol),tv=window.__tvResult;
  if(tv&&tv.symbol===symbol)s+='TRADINGVIEW TECHNICAL RATING (independent method): overall '+tv.d.all+' ('+P1_T.en[tvLabel(tv.d.all)]+'), moving averages '+tv.d.ma+', oscillators '+tv.d.osc+'.\n';
  return s;
};
